# One or two plain sentences per block and item, for players: the wiki's block and item pages, the
# in-game guide, and the catalogue cards (which show the first sentence, so keep it short).
# Numbers and rules belong on the hand-written pages, where they're quoted from the code.

# ---- Unrealised Matter ----
unrealised_ore: "Ore that drops Unrealized Matter. Silk Touch keeps the block, which machines also accept."
unrealised_matter: "Unidentified ore. Becomes a real ore in an Observation Chamber or Materializer."
observation_chamber: "Turns Unrealized Matter into ore on a redstone pulse, sometimes leaving a Quantimium Trace."
quantum_observation_chamber: "The powered Observation Chamber. It works through Matter on its own and connects to pipes on every side."
materialiser: "Turns Unrealized Matter into an ore you choose, for Traces, flux and power. Hotter fields allow rarer ores."
quantimium_trace: "Residue left by Observation Chambers. The base material of most Quantimium machines."
# ---- Reading and steering the field ----
flux_meter: "Shows the flux and anomaly of your chunk. Use it on a machine to see what it is doing."
flux_detector: "Turns the flux or anomaly of its chunk into a redstone signal."
field_monitor: "Maps the chunks around it and sounds an alarm when the field turns dangerous."
quantum_exciter: "Converts FE into flux to hold the field at Medium or High."
flux_suppressor: "Keeps the flux around it below a ceiling you choose. Use it for firebreaks and to starve rifts."
basic_anomaly_siphon: "Holds anomaly down around a small workshop, and yields Anomaly Fragments."
anomaly_siphon: "Keeps anomaly below a ceiling you choose over a wide area. Yields Anomaly Fragments."
flux_maintainer: "Keeps the flux around it at or above a floor you choose."
field_regulator: "A Flux Maintainer and an Anomaly Siphon in one block, for less power."
zeno_field_controller: "Pauses or speeds up random ticks (up to 16x) in an area."
anomaly_fragment: "Produced by Anomaly Siphons. A common ingredient in mid-game machines."
debug_field_emitter: "Creative only. Emits flux like a machine spending that much power."
creative_energy_cell: "Creative only. Endless power for the blocks next to it."
creative_energy_void: "Creative only. Voids all the power it is given."
# ---- Crafting ----
basic_decoherence_matrix: "Crafting component of the Basic Quantum Crafter."
basic_quantum_crafter: "The first crafter. With a crafting table, furnace or stonecutter as its catalyst, it crafts their recipes instantly."
quantum_crafter: "Crafts any machine's recipes instantly, with that machine as its catalyst. Hotter fields unlock stronger catalysts."
quantum_simulator: "Runs the machine on top of it many times at once. Up to 32x in the hottest field."
quantum_containment: "The field above an engaged Quantum Simulator, holding its machine."
me_superposition_crafter: "Offers every recipe of its catalyst to an AE2 network as ready-made patterns."
# ---- Tesseracts ----
semi_stable_tesseract: "A simple link to an inventory nearby. Also what a Sophon is folded into."
tesseract: "A stable link to an inventory anywhere. Machines read through it as if the inventory were next to them."
tesseract_stabilizer: "Holds a Tesseract and opens its inventory to pipes."
entangled_dock: "Charges an item you carry, wherever you are, from power fed into the dock."
folded_tesseract: "A whole multiblock folded into one item. A catalyst for everything the machine makes; unfold it in a Fold Chamber."
# ---- The Quantum Foundry ----
quantum_foundry_controller: "Controls the Quantum Foundry, a multiblock that makes the field's materials."
quantum_foundry_plinth: "The Foundry's floor, and the base of other multiblocks."
quantum_foundry_conduit: "Carries the field between the Foundry and an arm's pillar."
quantum_foundry_pillar: "Draws on the local field for the Foundry. One stands at the end of each arm."
quantum_foundry_attunement_tank: "Sits on an Attunement Pillar and holds what the arm has drawn."
quantum_attuned_glass: "Glass tuned to the field. It walls in the Containment Hall and glows faintly."
# ---- Anomalite ----
anomalite_crystal: "Grows on machines in an uncontained anomalous field, draining their power. Only visible in the mirror."
budding_anomalite: "Grows Anomalite Crystals in the mirror while powered, whatever the field."
anomalite_shard: "What a full-grown Anomalite Crystal breaks into."
anomalite_dust: "Left by crystals broken early, or crushed Anomalite. The Foundry refines it into shards. Materializers accept it as payment."
anomalite_lattice: "Four Anomalite Shards packed together, for sturdier parts."
anomalite_cell: "Fuel for a Decoherence Projector: a prism of Anomalite in glass."
anomalite_emitter: "Crafting ingredient: a shard set in a mount."
rift_lens: "Lets lasers into the mirror by holding a small tear open."
# ---- The mirror ----
mirror_lens: "Goggles that show the field around you and what lives in it."
decoherence_lance: "Hold to channel. Closes rifts and harms only what is caught between worlds."
decoherence_projector: "A Decoherence Lance on a pedestal, burning Anomalite Cells. Beside a Containment Hall it traps the Veiled."
mirror_short_grass: "Gray grass that grows in the mirror."
mirror_tall_grass: "Tall gray grass that grows in the mirror."
mirror_vine: "Gray vines that hang in the mirror."
mirror_dead_bush: "A gray dead bush that grows in the mirror."
mirror_hanging_roots: "Gray roots that hang in the mirror."
# ---- Rifts ----
rift_seed: "Opens a rift. Plant it in high anomaly, on a Rift Anchor, or in a Portal frame."
rift_anchor: "The footing for a rift held on purpose, with Rift Stabilizers around it."
rift_stabiliser: "Holds a rift on a Rift Anchor while powered. Three or more keep it tame."
rift_residue: "Left when a rift closes, and made by a held rift. A Containment Hall holding the Veiled burns it."
stabilised_portal_frame: "Frame block for a Stabilized Portal. Light it with a Rift Seed to open a way into the mirror."
stabilised_portal: "The way through a Stabilized Portal's frame."
veil_thread: "A strand drawn from a Veiled held in a Containment Hall."
anomaly_containment_hall: "A glass cell that holds anomaly down around it, and can hold the Veiled."
# ---- The Superposition Pod ----
unfolding_array: "Folds a copy of you into a Sophon, while you stand on its pad."
array_pylon: "One of the four pylons at the corners of an Unfolding Array."
sophon: "A body double, folded up. Unfold it into a Superposition Pod."
superposition_pod: "Holds one of your body doubles. Swap into any of your doubles from an empty pod, and back."
pod_cradle: "The base a Superposition Pod stands on."
pod_plating: "Fills an edge of a pod's cradle that has no module."
pod_regeneration_module: "A pod module that slowly heals you."
pod_hardening_module: "A pod module that makes you tougher."
pod_charge_module: "A pod module that charges the items you carry."
pod_ward_module: "Pod module that keeps hostile mobs away from the double inside."
pod_stash_module: "A pod module that gives you a stash you can open anywhere."
pod_logistics_module: "A pod module that opens a logistics network's terminal from anywhere."
pod_relay_module: "A pod module that links pods into a network, to send doubles between them."
pod_recovery_module: "A pod module that brings stranded doubles home."
pod_rescue_module: "A pod module that catches you at death and wakes you in a double."
tether: "A pod's screen in your hand: swap into your doubles from anywhere."
# ---- The Fold Chamber ----
fold_core: "The control block of a Fold Chamber, which folds a multiblock into one item."
fold_pylon: "The corners of a Fold Chamber's frame."
fold_rail: "The edges of a Fold Chamber's frame."
# ---- The Quantimium Reactor ----
singularity: "A Tesseract collapsed into a black hole. Seated in a Horizon Core, it holds everything the Reactor holds."
horizon_core: "The core of the Quantimium Reactor, holding its Singularity."
reactor_plinth: "The disc the Reactor stands on. Its circuits light up when the Reactor forms."
lit_reactor_plinth: "Reactor Plinth with its circuits always lit, for building with. Crafts back into Reactor Plinth."
ring_emitter: "Stands on the Reactor's plinth in facing pairs. Each pair drives a ring that lets the horizon hold more."
catalyst_bay: "A window in the Reactor's floor holding up to four machines as catalysts."
reactor_input_port: "Takes items into the Reactor from pipes and hoppers."
reactor_output_port: "Where the Reactor delivers what you take from it."
reactor_energy_port: "Takes power into the Reactor."
reactor_materialiser_port: "Exposes the Reactor's contents and recipes to pipes and storage buses. Makes what they take."
reactor_me_port: "Joins the Reactor to an ME network as storage, patterns and inputs."
# ---- Lasers ----
flash_emitter: "The first laser emitter. Burns furnace fuel, or takes power, and sends it as a laser."
laser_emitter_1: "Sends power as a laser, as much as its targets ask for. Sneak-click a face to add another."
laser_emitter_2: "A stronger laser emitter, with more power and a longer reach."
laser_emitter_3: "The strongest laser emitter."
solar_emitter: "Turns sunlight into laser power. Passes other lasers on."
laser_mirror: "Reflects lasers through a right angle, or straight back."
laser_splitter: "A half-silvered mirror: splits a laser in two, or joins two into one."
laser_relay: "Legacy block. Placing it makes a Laser Focus with a Focus Stand and Focus Emitter."
laser_focus: "Stops lasers and sends them out of the Focus Emitters on its faces. Place it, then add attachments."
clear_laser_focus: "A Laser Focus that also lets lasers pass straight through. Attachments on the far face can stop it."
focus_stand: "Stands a Laser Focus on the block behind it. No laser gets in or out by it."
focus_emitter: "Sends the laser out of a Laser Focus, through the one lens it holds. Has its own redstone setting."
focus_cover: "Closes a face of a Laser Focus: no laser gets in or out."
laser_prism: "Sends its laser to each linked block in a straight line, at any angle. Splits and joins lasers."
laser_linker: "Links a Laser Prism to the blocks its laser should reach."
cavity_mirror: "Focus attachment that stores returning lasers: a battery for a laser network."
entangled_mirror: "Sends on the laser of its Tesseract's bound block, at any distance."
photodetector: "Lets lasers pass and gives a redstone signal for how much."
lens_mount: "Holds four lenses: the laser goes straight through, past each in turn."
logistics_controller: "Starts a logistics network from the laser it receives. Lenses past it put items in and take them out."
logistics_receptacle: "Focus attachment that adds the inventory behind it to a logistics network. Acts as storage, provider or requester."
reactor_logistics_port: "Puts the Reactor on a logistics network, and takes power from the laser."
logistics_materialiser: "Offers a whole logistics network to any mod's pipes and storage buses."
logistics_terminal: "Shows everything a logistics network holds, to take or put away."
logistics_lectern: "The Logistics Terminal on a stand, with its screen over a focus."
laser_port: "Collects items from Pickup Lenses, or sends items down the laser, or both. Lasers pass through it."
harvest_lens: "Breaks the block the laser ends on."
damage_lens: "Hurts what stands in the laser."
pickup_lens: "Returns items in the laser, and what it frees, to a Laser Port."
range_lens: "Doubles how far each run of the laser reaches."
filter_lens: "Limits the actions before it to the items it lets through."
block_filter_lens: "Limits Harvest to the blocks it lets through."
entity_filter_lens: "Limits the actions it changes to the living things it lets through."
uv_lens: "The laser can only be seen with a wrench in hand."
amplify_lens: "Harder cutting and harder hits, for more power."
place_lens: "Places blocks a Laser Port sends, where the laser ends."
speed_lens: "Its actions work twice as fast."
phantom_lens: "The laser passes through blocks, for a little power each."
insert_lens: "Puts what Laser Ports send into the inventory the laser ends on."
interact_lens: "Uses a Laser Port's item, or an empty hand, on the laser's target."
precision_lens: "Harvest mines with Silk Touch."
void_lens: "Destroys what the actions free and no Laser Port takes."
freezing_lens: "Freezes what the laser ends on: water, machines, mobs and players."
redstone_lens: "Gives what the laser ends on a redstone signal."
healing_lens: "Heals living things in the laser, and hurts the undead."
acceleration_lens: "Speeds up the machine the laser ends on, within a tick-time budget."
harmonic_lens: "Harvest mines with Fortune, Damage hits with Looting, a level per lens."
smelting_lens: "Smelts what the actions before it free or move. Alone, it smelts what the laser ends on."
crushing_lens: "Crushes what the actions before it free or move. Alone, it crushes what the laser ends on."
unrealising_lens: "Ore mined by Harvest comes away as Unrealized Matter."
extract_lens: "Takes items from the inventory the laser ends on, back up to Laser Ports."
isolator: "Lets power through, and nothing the laser did: actions and items stop at it."
isolator_lens: "Lets power through, plus whatever else it is set to pass."
area_prism: "Spreads the actions of its laser over an area, set with the Laser Linker."
spectroscope: "Shows what a laser block's laser carries: reach, actions, who pays."