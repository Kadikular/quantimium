name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Minecraft 26.1 runs on Java 25.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      # The in-game test suite, with no partner mods but AE2 (a dev dependency).
      - name: Game tests
        run: ./gradlew runGameTestServer -PbareMods

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: quantimium
          path: build/libs/*.jar
