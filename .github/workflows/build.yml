name: Build

# The jar is built on every push. The game tests run only when started by hand
# (Actions -> Build -> Run workflow, with "Run the game tests" ticked).
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      gametests:
        description: Run the game tests
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Minecraft 26.1 runs on Java 25.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      # The in-game test suite, with no partner mods but AE2 (a dev dependency). By hand only.
      - name: Game tests
        if: github.event_name == 'workflow_dispatch' && inputs.gametests
        run: ./gradlew runGameTestServer -PbareMods

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: quantimium
          path: build/libs/*.jar
