plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("**/*.xcf") // GIMP working files

    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
    maven {
        name = "Jared's maven" // JEI
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "ModMaven" // JEI mirror
        url = "https://modmaven.dev"
    }
    maven {
        name = "NeoForged" // AE2's API
        url = "https://maven.neoforged.net/releases"
        content { includeGroup "org.appliedenergistics" }
    }
    maven {
        name = "Modrinth" // Jade
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven {
        name = "JourneyMap" // its API
        url = "https://jm.gserv.me/repository/maven-public/"
        content { includeGroup "info.journeymap" }
    }
}

base {
    archivesName = mod_id
}

// The jar names the Minecraft version it is for: quantimium-0.3.0-alpha+mc26.1.2.jar.
tasks.withType(Jar).configureEach {
    archiveVersion = "${project.mod_version}+mc${project.minecraft_version}"
}

// Minecraft 26.1 runs on Java 25, so mods target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    // 26.1 runs in its own folders (run-26.1, runs-26.1, run-gametest-26.1), so this branch never
    // loads the 1.21.1 branch's mods or upgrades its worlds.
    runs {
        client {
            client()
            gameDirectory = project.file('run-26.1')
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // GuideME checks every page of the in-game guide at the title screen and logs what fails.
            systemProperty 'guideme.validateAtStartup', 'quantimium:guide'
        }

        client2 {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            programArguments.addAll('--username', 'Dev2')
            gameDirectory = project.file('runs-26.1/client2')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Captures the machine GUIs for the wiki and quits; run it through tools/wiki_shots.sh.
        wikiShots {
            client()
            gameDirectory = project.file('runs-26.1/wikishots')
            programArguments.addAll('--width', '1280', '--height', '800')
            systemProperty 'quantimium.wikiShots', project.file('wiki/pages/assets/gui').absolutePath
        }

        server {
            server()
            gameDirectory = project.file('run-26.1')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            // Its own folder, with run-26.1/mods copied in minus client-only mods (see syncGameTestMods).
            gameDirectory = project.file('run-gametest-26.1')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // TickTimingTests write their measurements here; the wiki builds its tick-timing page from it.
            if (project.hasProperty('gtFilter')) systemProperty 'quantimium.gametestFilter', project.gtFilter
            // ./gradlew runGameTestServer -PexportStructures builds the guide's multiblocks and saves them in wiki/structures.
            if (project.hasProperty('exportStructures')) systemProperty 'quantimium.exportStructures',
                    project.file('wiki/structures').absolutePath
            systemProperty 'quantimium.tickReport', project.file('wiki/data/tick-timing.json').absolutePath
            // ./gradlew runGameTestServer -Pjfr records a Flight Recorder profile of the whole run, sampling
            // every millisecond, with each tick-timing scenario run for 20,000 ticks so it shows up.
            if (project.hasProperty('jfr')) {
                jvmArgument "-XX:StartFlightRecording=filename=${project.file('build/gametest.jfr').absolutePath},settings=profile,jdk.ExecutionSample#period=1ms"
                systemProperty 'quantimium.tickTimingSamples', '20000'
            }
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            // LAN discovery on Linux otherwise advertises fe80:: without a scope id, and Netty
            // rejects the connect. IPv4 keeps Open to LAN and localhost working for client2.
            systemProperty 'java.net.preferIPv4Stack', 'true'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// The test server loads run-26.1/mods like the client, bar mods that break a dedicated server with the
// tests' fake players: JourneyMap loads client classes when one joins. Map mods are client-side anyway.
// Client-only partner mods, copied into the client's mods folder rather than put on every run's classpath.
configurations {
    devClientMods
}
tasks.register('copyDevClientMods', Copy) {
    from configurations.devClientMods
    into 'run-26.1/mods'
}
tasks.matching { it.name in ['runClient', 'runClient2'] }.configureEach {
    dependsOn 'copyDevClientMods'
}

// The test server also gets run-26.1/gametest-mods: partner mods only the tests need, kept out of the dev
// client (Mystical Agriculture crashes the creative inventory without the rest of its family).
tasks.register('syncGameTestMods', Sync) {
    from 'run-26.1/mods'
    from 'run-26.1/gametest-mods'
    into 'run-gametest-26.1/mods'
    exclude 'journeymap*', 'xaero*', 'Xaero*'
}
// ./gradlew runGameTestServer -PbareMods runs with no other mods at all, to prove none is needed.
tasks.register('clearGameTestMods', Delete) {
    delete 'run-gametest-26.1/mods'
}
def bareMods = providers.gradleProperty('bareMods').isPresent()
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn(bareMods ? 'clearGameTestMods' : 'syncGameTestMods')
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // JEI is an optional dependency: compile against the API, and use the full jar only for dev
    // runtime. localRuntime rather than runtimeOnly so dependents of this mod do not inherit it.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // AE2 is optional too: the ME Superposition Crafter compiles against its API and only registers
    // when AE2 is loaded. The full jar (and GuideME, which AE2 needs and the field guide uses) runs in
    // every dev run, the gametest server included, so the AE2 compat is exercised.
    compileOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}:api"
    localRuntime "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    localRuntime "org.appliedenergistics:guideme:${guideme_version}"
    // Jade (optional): the block tooltips in compat/jade.
    compileOnly "maven.modrinth:jade:${jade_version}"
    localRuntime "maven.modrinth:jade:${jade_version}"
    // Map overlay (optional): compat/map draws the field on JourneyMap. JourneyMap itself is client
    // only (it breaks a dedicated server), so it goes to the client's mods folder (devClientMods), not here.
    compileOnly "info.journeymap:journeymap-api-neoforge:${journeymap_api_version}"
    devClientMods("maven.modrinth:journeymap:${journeymap_version}") { transitive = false }

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
